     <section class="py-10 px-4">
    <h2 class="font-bold text-center text-green-900 mb-6 text-2xl">مجموعه سبز ما</h2>

    <!-- گرید اصلی: در موبایل 1 ستون، در دسکتاپ 3 ستون -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-6xl mx-auto">
        
        <!-- عکس اول (ستون سمت چپ): در موبایل 1 ستون، در دسکتاپ 1 ستون از 3 ستون -->
        <div class="col-span-1 md:row-span-2">
            <img src="/src/images/image 5.png" 
                 class="w-full h-80 md:h-full object-cover rounded-lg shadow-md" 
                 alt="Main Image">
        </div>

        <!-- ظرفِ عکس‌های سمت راست: در موبایل 1 ستون، در دسکتاپ 2 ستون از 3 ستون -->
        <!-- این ظرف خودش یک گرید 2 در 2 است -->
        <div class="col-span-1 md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- عکس دوم -->
            <div class="h-64">
                <img src="/src/images/pexels-cottonbro-studio-4507715 3.png" 
                     class="w-full h-full object-cover rounded-lg shadow-md" alt="">
            </div>

            <!-- عکس سوم -->
            <div class="h-64">
                <img src="/src/images/pexels-cottonbro-studio-4507715 2.png" 
                     class="w-full h-full object-cover rounded-lg shadow-md" alt="">
            </div>

            <!-- عکس چهارم -->
            <div class="h-64">
                <img src="/src/images/pexels-cottonbro-studio-4507715 5.png" 
                     class="w-full h-full object-cover rounded-lg shadow-md" alt="">
            </div>

            <!-- عکس پنجم -->
            <div class="h-64">
                <img src="/src/images/pexels-cottonbro-studio-4507715 4.png" 
                     class="w-full h-full object-cover rounded-lg shadow-md" alt="">
            </div>

        </div> <!-- پایان ظرف سمت راست -->

    </div>
</section>
